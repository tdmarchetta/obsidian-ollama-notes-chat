name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write       # gh release create
  id-token: write       # Sigstore OIDC for attestation
  attestations: write   # write the attestation record

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify version matches tag
        run: |
          tag="$GITHUB_REF_NAME"
          [ "$(jq -r .version manifest.json)" = "$tag" ] \
            || { echo "::error::manifest.json version != tag ($tag)"; exit 1; }
          [ "$(jq -r .version package.json)" = "$tag" ] \
            || { echo "::error::package.json version != tag ($tag)"; exit 1; }
          [ "$(jq --arg v "$tag" 'has($v)' versions.json)" = "true" ] \
            || { echo "::error::versions.json has no entry for $tag"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css
